<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal SIMPEG - PT Sepur Engineering</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#eff6ff', 600: '#1d4ed8', 700: '#1e40af', 900: '#1e3a8a' }
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans selection:bg-brand-600 selection:text-white bg-slate-900 overflow-hidden">

    <!-- AUDIO RINGAN (Hanya untuk klik) -->
    <audio id="sfx-click" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3?filename=success-1-6297.mp3" preload="none"></audio>
    <audio id="sfx-error" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_c6ccf3232f.mp3?filename=error-126627.mp3" preload="none"></audio>

    <!-- SLIDESHOW BACKGROUND (Sangat Ringan, Tanpa Blur) -->
    <div class="fixed inset-0 z-0">
        <div id="bg-layer-1" class="absolute inset-0 bg-cover bg-center transition-opacity duration-1000 opacity-100"></div>
        <div id="bg-layer-2" class="absolute inset-0 bg-cover bg-center transition-opacity duration-1000 opacity-0"></div>
        <!-- Overlay gelap solid sebagai pengganti blur -->
        <div class="absolute inset-0 bg-slate-900/80"></div>
    </div>

    <!-- CONTAINER UTAMA LOGIN -->
    <div class="relative z-10 min-h-screen flex flex-col items-center justify-center p-4">
        
        <!-- Form Card (Langsung Muncul, Tanpa Animasi Berat) -->
        <div class="w-full max-w-md bg-white rounded-xl shadow-2xl overflow-hidden border-t-4 border-brand-600">
            
            <div class="px-8 pt-8 pb-6 text-center border-b border-slate-100 bg-slate-50">
                <img src="https://ckjwipxaftcqxtyskgxd.supabase.co/storage/v1/object/public/cdn-files/5c369a3c-3675-4fd1-9081-c9f421814afc/1777384550739-lsa6lxm7s7.png" 
                     alt="Logo PT Sepur Engineering" 
                     class="h-14 mx-auto mb-4">
                <h1 id="dynamic-greeting" class="text-xl font-bold text-slate-800 tracking-tight">Portal Pegawai</h1>
                <p class="text-sm text-slate-500 mt-1">PT. Sepur Engineering Roblox</p>
            </div>

            <div class="p-8">
                
                <div id="alert-captcha" class="hidden mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded text-sm flex items-start">
                    <i class="fa-solid fa-circle-exclamation mt-0.5 mr-2"></i>
                    <span>Akses ditolak. Selesaikan verifikasi keamanan.</span>
                </div>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    
                    <div class="relative mb-5">
                        <input type="text" id="nip" name="nip" required autocomplete="off"
                            class="block px-4 pb-2.5 pt-6 w-full text-sm text-slate-900 bg-slate-50 border border-slate-300 rounded-lg appearance-none focus:outline-none focus:ring-2 focus:ring-brand-600 focus:bg-white peer transition-colors"
                            placeholder=" ">
                        <label for="nip" class="absolute text-sm text-slate-500 duration-200 transform -translate-y-3 scale-75 top-4 z-10 origin-[0] left-4 peer-focus:text-brand-600 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-3 cursor-text">
                            Nomor Induk Pegawai (NIP)
                        </label>
                    </div>

                    <div class="relative mb-6">
                        <input type="password" id="password" name="password" required
                            class="block px-4 pb-2.5 pt-6 w-full text-sm text-slate-900 bg-slate-50 border border-slate-300 rounded-lg appearance-none focus:outline-none focus:ring-2 focus:ring-brand-600 focus:bg-white peer transition-colors"
                            placeholder=" ">
                        <label for="password" class="absolute text-sm text-slate-500 duration-200 transform -translate-y-3 scale-75 top-4 z-10 origin-[0] left-4 peer-focus:text-brand-600 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-3 cursor-text">
                            Kata Sandi
                        </label>
                        <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-brand-600 focus:outline-none z-20">
                            <i id="eye-icon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>

                    <!-- CAPTCHA Box -->
                    <div class="mb-6 bg-slate-50 border border-slate-200 p-3 rounded-lg flex items-center justify-between hover:border-brand-300 transition-colors cursor-pointer" onclick="verifyCaptcha()">
                        <div class="flex items-center gap-3">
                            <div id="captcha-box" class="w-7 h-7 border-2 border-slate-300 rounded bg-white flex items-center justify-center transition-colors">
                                <i id="captcha-icon" class="hidden fa-solid fa-check text-emerald-600 text-lg"></i>
                                <i id="captcha-spinner" class="hidden fa-solid fa-spinner fa-spin text-brand-600"></i>
                            </div>
                            <span class="text-sm text-slate-700 font-medium select-none">Verifikasi Keamanan</span>
                        </div>
                        <i class="fa-solid fa-shield-halved text-slate-300 text-lg"></i>
                    </div>

                    <button type="submit" id="btn-login" 
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg text-sm font-semibold text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-600 transition-colors">
                        <span id="btn-text">Otorisasi Akses</span>
                        <i id="btn-icon" class="fa-solid fa-arrow-right-to-bracket ml-2 mt-0.5"></i>
                    </button>
                </form>
            </div>
            
            <div class="bg-slate-50 px-8 py-4 border-t border-slate-200 text-center">
                <a href="#" class="text-xs font-semibold text-slate-600 hover:text-brand-600 transition-colors">
                    <i class="fa-solid fa-tower-cell"></i> Server Status: <span class="text-emerald-600 font-bold">ONLINE</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        // Sapaan Waktu Otomatis
        const hour = new Date().getHours();
        let greeting = "Selamat Malam";
        if (hour >= 4 && hour < 11) greeting = "Selamat Pagi";
        else if (hour >= 11 && hour < 15) greeting = "Selamat Siang";
        else if (hour >= 15 && hour < 18) greeting = "Selamat Sore";
        document.getElementById('dynamic-greeting').innerText = greeting;

        // Slideshow Background (Dibuat lebih ringan)
        const bgImages = [
            "https://ckjwipxaftcqxtyskgxd.supabase.co/storage/v1/object/public/cdn-files/5c369a3c-3675-4fd1-9081-c9f421814afc/1784993512493-e7ajgpowzrf.png",
            "https://ckjwipxaftcqxtyskgxd.supabase.co/storage/v1/object/public/cdn-files/5c369a3c-3675-4fd1-9081-c9f421814afc/1784993512495-tb6f9zinovl.png",
            "https://ckjwipxaftcqxtyskgxd.supabase.co/storage/v1/object/public/cdn-files/5c369a3c-3675-4fd1-9081-c9f421814afc/1784993512495-2vcmx4innkz.png",
            "https://ckjwipxaftcqxtyskgxd.supabase.co/storage/v1/object/public/cdn-files/5c369a3c-3675-4fd1-9081-c9f421814afc/1784993526430-locslgrfrmd.png",
            "https://ckjwipxaftcqxtyskgxd.supabase.co/storage/v1/object/public/cdn-files/5c369a3c-3675-4fd1-9081-c9f421814afc/1784993526430-h2w5plzuw18.png",
            "https://ckjwipxaftcqxtyskgxd.supabase.co/storage/v1/object/public/cdn-files/5c369a3c-3675-4fd1-9081-c9f421814afc/1784993526431-6ydroigyjc9.png"
        ];
        
        let currentImageIndex = 0; 
        let activeLayer = 1;
        const layer1 = document.getElementById('bg-layer-1');
        const layer2 = document.getElementById('bg-layer-2');
        layer1.style.backgroundImage = `url('${bgImages[0]}')`;

        setInterval(() => {
            currentImageIndex = (currentImageIndex + 1) % bgImages.length;
            const nextImageUrl = `url('${bgImages[currentImageIndex]}')`;
            
            if (activeLayer === 1) {
                layer2.style.backgroundImage = nextImageUrl;
                layer2.classList.replace('opacity-0', 'opacity-100');
                layer1.classList.replace('opacity-100', 'opacity-0');
                activeLayer = 2;
            } else {
                layer1.style.backgroundImage = nextImageUrl;
                layer1.classList.replace('opacity-0', 'opacity-100');
                layer2.classList.replace('opacity-100', 'opacity-0');
                activeLayer = 1;
            }
        }, 5000);

        // CAPTCHA & Login Logic
        const sfxClick = document.getElementById('sfx-click');
        const sfxError = document.getElementById('sfx-error');
        let isCaptchaVerified = false;

        function verifyCaptcha() {
            if (isCaptchaVerified) return; 

            const box = document.getElementById('captcha-box');
            const iconCheck = document.getElementById('captcha-icon');
            const iconSpinner = document.getElementById('captcha-spinner');
            const alertCaptcha = document.getElementById('alert-captcha');

            iconSpinner.classList.remove('hidden');
            alertCaptcha.classList.add('hidden');

            setTimeout(() => {
                iconSpinner.classList.add('hidden');
                iconCheck.classList.remove('hidden');
                
                box.classList.remove('border-slate-300');
                box.classList.add('border-emerald-500', 'bg-emerald-50'); 
                isCaptchaVerified = true;
                
                sfxClick.play().catch(()=>{}); // Mainkan suara jika diizinkan browser
            }, 1000);
        }

        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                pwd.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function handleLogin(event) {
            event.preventDefault(); 
            if (!isCaptchaVerified) {
                sfxError.play().catch(()=>{}); 
                document.getElementById('alert-captcha').classList.remove('hidden');
                return; 
            }
            
            sfxClick.play().catch(()=>{}); 
            const btn = document.getElementById('btn-login');
            const btnText = document.getElementById('btn-text');
            const btnIcon = document.getElementById('btn-icon');
            
            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            btnText.innerText = 'Mengotorisasi...';
            btnIcon.className = 'fa-solid fa-circle-notch fa-spin ml-2 mt-0.5';

            // Pindah ke file index.html setelah 1.5 detik
            setTimeout(() => window.location.href = 'index.html', 1500);
        }
    </script>
</body>
</html>
